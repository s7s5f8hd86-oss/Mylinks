<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Vault</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e14;
    --card: #12161f;
    --card2: #171c27;
    --border: #232936;
    --text: #eef1f6;
    --muted: #8892a4;
    --accent: #4f8fff;
    --accent2: #7c5cfc;
    --green: #22c55e;
    --red: #ef4444;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', -apple-system, sans-serif;
    padding: 1rem;
    color: var(--text);
  }
  .container { width: 100%; max-width: 520px; }
  button { font-family: inherit; }
  button:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* LOGIN */
  .login-card {
    background: var(--card);
    border-radius: 1.5rem;
    border: 1px solid var(--border);
    padding: 2.2rem 1.6rem;
    box-shadow: 0 20px 60px -20px rgba(0,0,0,0.6);
    text-align: center;
  }
  .login-card .icon { font-size: 2.4rem; margin-bottom: 0.4rem; }
  .login-card h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 0.2rem; letter-spacing: -0.01em; }
  .login-card .sub { font-size: 0.78rem; color: var(--muted); margin-bottom: 1.6rem; }
  .login-card input {
    width: 100%;
    background: #0d1117;
    border: 1px solid var(--border);
    border-radius: 0.8rem;
    padding: 0.85rem 1rem;
    color: var(--text);
    font-size: 0.95rem;
    outline: none;
    margin-bottom: 0.7rem;
    font-family: inherit;
    transition: border-color 0.15s;
  }
  .login-card input:focus { border-color: var(--accent); }
  .login-card button {
    width: 100%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    border: none;
    border-radius: 0.8rem;
    padding: 0.9rem;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
    margin-top: 0.3rem;
    transition: opacity 0.15s, transform 0.1s;
  }
  .login-card button:disabled { opacity: 0.5; cursor: default; }
  .login-card button:not(:disabled):active { transform: scale(0.98); }
  .msg { font-size: 0.8rem; margin-top: 0.7rem; min-height: 1rem; }
  .msg.err { color: var(--red); }
  .msg.ok { color: var(--green); }
  .msg.muted { color: var(--muted); }

  /* DASHBOARD */
  .dashboard { display: none; background: var(--card); border-radius: 1.5rem; border: 1px solid var(--border); padding: 1.5rem 1.3rem; box-shadow: 0 20px 60px -20px rgba(0,0,0,0.6); }
  .dash-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.2rem; }
  .dash-header h2 { font-size: 1.25rem; font-weight: 700; }
  .dash-header .actions { display: flex; gap: 0.4rem; align-items: center; }
  .save-indicator { font-size: 0.7rem; color: var(--muted); min-width: 3.5rem; text-align: right; }
  .save-indicator.ok { color: var(--green); }
  .save-indicator.err { color: var(--red); }
  .logout-btn { background: var(--card2); border: 1px solid var(--border); color: var(--muted); padding: 0.5rem 0.9rem; border-radius: 0.7rem; font-size: 0.78rem; cursor: pointer; font-weight: 600; }
  .logout-btn:hover { color: var(--red); border-color: var(--red); }

  .tabs { display: flex; gap: 0.3rem; margin-bottom: 1.2rem; overflow-x: auto; padding-bottom: 0.3rem; }
  .tabs button { background: var(--card2); border: 1px solid var(--border); color: var(--muted); padding: 0.6rem 0.9rem; border-radius: 0.7rem; font-size: 0.78rem; font-weight: 600; cursor: pointer; white-space: nowrap; transition: all 0.15s; }
  .tabs button.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .tab-content { display: none; }
  .tab-content.active { display: block; }
  .section-title { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 0.6rem; font-weight: 700; }
  .form-row { display: flex; gap: 0.5rem; margin-bottom: 0.6rem; }
  .form-row input { flex: 1; min-width: 0; background: #0d1117; border: 1px solid var(--border); border-radius: 0.7rem; padding: 0.7rem 0.9rem; color: var(--text); font-size: 0.85rem; outline: none; }
  .form-row input:focus { border-color: var(--accent); }
  .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; border: none; border-radius: 0.7rem; padding: 0.7rem 1rem; font-weight: 700; font-size: 0.85rem; cursor: pointer; white-space: nowrap; transition: opacity 0.15s; }
  .btn-primary:disabled { opacity: 0.5; cursor: default; }
  .btn-primary.block { width: 100%; margin-top: 0.2rem; }
  .full-input { width: 100%; background: #0d1117; border: 1px solid var(--border); border-radius: 0.7rem; padding: 0.7rem 0.9rem; color: var(--text); font-size: 0.85rem; outline: none; margin-bottom: 0.6rem; font-family: inherit; }
  .full-input:focus { border-color: var(--accent); }
  textarea.full-input { resize: vertical; min-height: 200px; line-height: 1.5; }

  .item-card { background: var(--card2); border: 1px solid var(--border); border-radius: 0.8rem; padding: 0.8rem 0.9rem; margin-bottom: 0.5rem; display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
  .item-info { flex: 1; min-width: 0; }
  .item-name { font-size: 0.85rem; font-weight: 600; }
  .item-detail { font-size: 0.72rem; color: var(--muted); margin-top: 0.15rem; word-break: break-all; font-family: 'JetBrains Mono', monospace; }
  .item-actions { display: flex; gap: 0.3rem; flex-shrink: 0; }
  .icon-btn { background: var(--card); border: 1px solid var(--border); color: var(--muted); width: 2rem; height: 2rem; border-radius: 0.5rem; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; cursor: pointer; }
  .icon-btn.copy:hover { color: var(--accent); border-color: var(--accent); }
  .icon-btn.del:hover { color: var(--red); border-color: var(--red); }

  .id-field { background: var(--card2); border: 1px solid var(--border); border-radius: 0.8rem; padding: 0.65rem 0.9rem; margin-bottom: 0.5rem; display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
  .id-label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; flex-shrink: 0; }
  .id-value { font-size: 0.83rem; font-weight: 500; text-align: right; word-break: break-all; flex: 1; font-family: 'JetBrains Mono', monospace; }
  .id-value.empty-val { color: #4a5264; font-family: 'Inter', sans-serif; }
  .id-actions { display: flex; gap: 0.3rem; margin-left: 0.5rem; flex-shrink: 0; }
  .id-edit-input { flex: 1; background: #0d1117; border: 1px solid var(--accent); border-radius: 0.5rem; padding: 0.4rem 0.6rem; color: var(--text); font-size: 0.83rem; outline: none; font-family: 'JetBrains Mono', monospace; }

  .empty { color: #4a5264; text-align: center; padding: 2rem; font-size: 0.85rem; }
  .toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%); background: #1c2129; border: 1px solid var(--border); color: var(--text); padding: 0.7rem 1.2rem; border-radius: 0.8rem; font-size: 0.82rem; font-weight: 500; z-index: 999; transition: opacity 0.3s; }
  .toast.err { border-color: var(--red); color: var(--red); }
</style>
</head>
<body>
<div class="container">
  <div class="login-card" id="loginScreen">
    <div class="icon">🔐</div>
    <h1>Vault</h1>
    <div class="sub">Enter your password to unlock</div>
    <input type="password" id="passwordInput" placeholder="Password" autocomplete="off" />
    <button id="loginBtn">Unlock</button>
    <div class="msg" id="loginMsg"></div>
  </div>

  <div class="dashboard" id="dashboard">
    <div class="dash-header">
      <h2>🔐 Vault</h2>
      <div class="actions">
        <span class="save-indicator" id="saveIndicator"></span>
        <button class="logout-btn" id="logoutBtn">Lock</button>
      </div>
    </div>

    <div class="tabs" id="tabs">
      <button class="active" data-tab="credentials">🔑 Credentials</button>
      <button data-tab="identity">🪪 Identity</button>
      <button data-tab="documents">📎 Docs</button>
      <button data-tab="notes">📝 Notes</button>
    </div>

    <div class="tab-content active" id="tab-credentials">
      <div class="section-title">Add login credential</div>
      <div class="form-row">
        <input type="text" id="credSite" placeholder="Site / app name" />
        <input type="text" id="credId" placeholder="ID / email" />
      </div>
      <div class="form-row">
        <input type="text" id="credPass" placeholder="Password" />
        <button class="btn-primary" id="addCredBtn">Add</button>
      </div>
      <div class="section-title" style="margin-top:1rem;">Saved credentials</div>
      <div id="credList"></div>
    </div>

    <div class="tab-content" id="tab-identity">
      <div class="section-title">Identity documents</div>
      <div id="identityFields"></div>
    </div>

    <div class="tab-content" id="tab-documents">
      <div class="section-title">Add document</div>
      <input type="text" id="docName" class="full-input" placeholder="Document name (e.g. PAN card scan)" />
      <input type="url" id="docLink" class="full-input" placeholder="Link (Drive, iCloud, etc.)" />
      <input type="text" id="docDesc" class="full-input" placeholder="Description (optional)" />
      <button class="btn-primary block" id="addDocBtn">Add document</button>
      <div class="section-title" style="margin-top:1rem;">Saved documents</div>
      <div id="docList"></div>
    </div>

    <div class="tab-content" id="tab-notes">
      <div class="section-title">Secure notes</div>
      <textarea id="notesArea" class="full-input" placeholder="Write anything..."></textarea>
      <button class="btn-primary block" id="saveNotesBtn">Save notes</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ── Configuration ──────────────────────────────────────────────
  // Set this to your deployed Worker URL after following SETUP.md.
  const WORKER_URL = "https://my-vault.s7s5f8hd86.workers.dev";
  // ────────────────────────────────────────────────────────────────

  const PBKDF2_ITERATIONS = 250000;

  let sessionToken = null;
  let encryptionKey = null; // CryptoKey, derived from password, held in memory only
  let currentSalt = null;   // base64, persisted alongside the ciphertext
  let vaultData = null;

  const loginScreen = document.getElementById("loginScreen");
  const dashboard = document.getElementById("dashboard");
  const loginMsg = document.getElementById("loginMsg");
  const loginBtn = document.getElementById("loginBtn");
  const passwordInput = document.getElementById("passwordInput");
  const saveIndicator = document.getElementById("saveIndicator");

  function setLoginMsg(text, cls) {
    loginMsg.textContent = text || "";
    loginMsg.className = "msg" + (cls ? " " + cls : "");
  }

  function showToast(msg, isErr) {
    const existing = document.querySelector(".toast");
    if (existing) existing.remove();
    const t = document.createElement("div");
    t.className = "toast" + (isErr ? " err" : "");
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => { t.style.opacity = "0"; setTimeout(() => t.remove(), 300); }, 2200);
  }

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  // ── Crypto helpers ─────────────────────────────────────────────
  function bufToB64(buf) {
    return btoa(String.fromCharCode(...new Uint8Array(buf)));
  }
  function b64ToBuf(b64) {
    const bin = atob(b64);
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return arr.buffer;
  }

  async function deriveKey(password, saltB64) {
    const saltBuf = b64ToBuf(saltB64);
    const baseKey = await crypto.subtle.importKey(
      "raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]
    );
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: saltBuf, iterations: PBKDF2_ITERATIONS, hash: "SHA-256" },
      baseKey,
      { name: "AES-GCM", length: 256 },
      false,
      ["encrypt", "decrypt"]
    );
  }

  async function encryptVault(obj, key) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const plaintext = new TextEncoder().encode(JSON.stringify(obj));
    const ciphertext = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, plaintext);
    return { iv: bufToB64(iv), ciphertext: bufToB64(ciphertext) };
  }

  async function decryptVault(wrapper, key) {
    const iv = new Uint8Array(b64ToBuf(wrapper.iv));
    const plainBuf = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, b64ToBuf(wrapper.ciphertext));
    return JSON.parse(new TextDecoder().decode(plainBuf));
  }

  function randomSaltB64() {
    return bufToB64(crypto.getRandomValues(new Uint8Array(16)));
  }

  // ── Backend calls ──────────────────────────────────────────────
  async function apiLogin(password) {
    const res = await fetch(WORKER_URL + "/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || "Login failed");
    }
    return res.json();
  }

  async function apiGetVault() {
    const res = await fetch(WORKER_URL + "/vault", {
      headers: { Authorization: "Bearer " + sessionToken },
    });
    if (!res.ok) throw new Error("Could not load vault");
    return res.json();
  }

  async function apiSaveVault(wrapper) {
    const res = await fetch(WORKER_URL + "/vault", {
      method: "PUT",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + sessionToken },
      body: JSON.stringify(wrapper),
    });
    if (!res.ok) throw new Error("Could not save vault");
  }

  async function persist() {
    saveIndicator.textContent = "Saving…";
    saveIndicator.className = "save-indicator";
    try {
      const { iv, ciphertext } = await encryptVault(vaultData, encryptionKey);
      await apiSaveVault({ salt: currentSalt, iv, ciphertext });
      saveIndicator.textContent = "Saved";
      saveIndicator.className = "save-indicator ok";
      setTimeout(() => { saveIndicator.textContent = ""; }, 1500);
    } catch (e) {
      saveIndicator.textContent = "Save failed";
      saveIndicator.className = "save-indicator err";
      showToast("Could not save — check your connection", true);
    }
  }

  // ── Login flow ────────────────────────────────────────────────
  async function doLogin() {
    if (WORKER_URL.includes("YOUR-WORKER-NAME")) {
      setLoginMsg("Set WORKER_URL in the code first — see SETUP.md", "err");
      return;
    }
    const password = passwordInput.value;
    if (!password) { setLoginMsg("Enter your password", "err"); return; }

    loginBtn.disabled = true;
    setLoginMsg("Unlocking…", "muted");
    try {
      const { token } = await apiLogin(password);
      sessionToken = token;

      const wrapper = await apiGetVault();

      if (!wrapper.ciphertext) {
        // First-ever run: no vault content yet — initialize a fresh one.
        currentSalt = randomSaltB64();
        encryptionKey = await deriveKey(password, currentSalt);
        vaultData = { credentials: [], identity: {}, documents: [], notes: "" };
        await persist();
      } else {
        currentSalt = wrapper.salt;
        encryptionKey = await deriveKey(password, currentSalt);
        try {
          vaultData = await decryptVault(wrapper, encryptionKey);
        } catch {
          setLoginMsg("Incorrect password", "err");
          loginBtn.disabled = false;
          sessionToken = null;
          return;
        }
      }

      passwordInput.value = "";
      setLoginMsg("");
      loginScreen.style.display = "none";
      dashboard.style.display = "block";
      renderAll();
    } catch (e) {
      setLoginMsg(e.message === "Incorrect password" ? "Incorrect password" : "Connection error — check the Worker URL", "err");
    }
    loginBtn.disabled = false;
  }

  loginBtn.addEventListener("click", doLogin);
  passwordInput.addEventListener("keypress", (e) => { if (e.key === "Enter") doLogin(); });

  document.getElementById("logoutBtn").addEventListener("click", () => {
    sessionToken = null;
    encryptionKey = null;
    vaultData = null;
    currentSalt = null;
    dashboard.style.display = "none";
    loginScreen.style.display = "block";
  });

  // ── Tabs ──────────────────────────────────────────────────────
  document.querySelectorAll(".tabs button").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tabs button").forEach((b) => b.classList.remove("active"));
      document.querySelectorAll(".tab-content").forEach((t) => t.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById("tab-" + btn.dataset.tab).classList.add("active");
    });
  });

  // ── Credentials ───────────────────────────────────────────────
  function renderCredentials() {
    const list = document.getElementById("credList");
    const creds = vaultData.credentials || [];
    if (creds.length === 0) { list.innerHTML = '<div class="empty">No credentials saved</div>'; return; }
    list.innerHTML = creds.map((c, i) => `
      <div class="item-card" data-index="${i}">
        <div class="item-info">
          <div class="item-name">${esc(c.site)}</div>
          <div class="item-detail">${esc(c.id)}${c.id && c.pass ? " · " : ""}${c.pass ? "•".repeat(Math.min(c.pass.length, 10)) : ""}</div>
        </div>
        <div class="item-actions">
          <button class="icon-btn copy" data-copy="id" title="Copy ID">📋</button>
          <button class="icon-btn copy" data-copy="pass" title="Copy password">🔑</button>
          <button class="icon-btn del" data-del title="Delete">✕</button>
        </div>
      </div>`).join("");

    list.querySelectorAll(".item-card").forEach((card) => {
      const i = Number(card.dataset.index);
      const cred = creds[i];
      card.querySelector('[data-copy="id"]').addEventListener("click", () => {
        navigator.clipboard.writeText(cred.id || ""); showToast("ID copied");
      });
      card.querySelector('[data-copy="pass"]').addEventListener("click", () => {
        navigator.clipboard.writeText(cred.pass || ""); showToast("Password copied");
      });
      card.querySelector("[data-del]").addEventListener("click", async () => {
        vaultData.credentials.splice(i, 1);
        renderCredentials();
        await persist();
        showToast("Credential deleted");
      });
    });
  }

  document.getElementById("addCredBtn").addEventListener("click", async () => {
    const site = document.getElementById("credSite").value.trim();
    const id = document.getElementById("credId").value.trim();
    const pass = document.getElementById("credPass").value.trim();
    if (!site) { showToast("Enter a site name", true); return; }
    vaultData.credentials.push({ site, id, pass });
    document.getElementById("credSite").value = "";
    document.getElementById("credId").value = "";
    document.getElementById("credPass").value = "";
    renderCredentials();
    await persist();
    showToast("Credential added");
  });

  // ── Identity ──────────────────────────────────────────────────
  const IDENTITY_FIELDS = [
    { key: "pan", label: "PAN card" },
    { key: "aadhaar", label: "Aadhaar" },
    { key: "dl", label: "Driving license" },
    { key: "bankAc", label: "Bank account" },
    { key: "ifsc", label: "IFSC code" },
    { key: "upi", label: "UPI ID" },
    { key: "other", label: "Other" },
  ];

  function renderIdentity() {
    const container = document.getElementById("identityFields");
    const id = vaultData.identity || (vaultData.identity = {});
    container.innerHTML = IDENTITY_FIELDS.map((f) => `
      <div class="id-field" data-key="${f.key}">
        <span class="id-label">${f.label}</span>
        <span class="id-value ${id[f.key] ? "" : "empty-val"}" data-role="value">${id[f.key] ? esc(id[f.key]) : "Not set"}</span>
        <div class="id-actions">
          <button class="icon-btn copy" data-role="copy" title="Copy">📋</button>
          <button class="icon-btn" data-role="edit" title="Edit">✏️</button>
        </div>
      </div>`).join("");

    container.querySelectorAll(".id-field").forEach((row) => {
      const key = row.dataset.key;
      row.querySelector('[data-role="copy"]').addEventListener("click", () => {
        navigator.clipboard.writeText(id[key] || ""); showToast("Copied");
      });
      row.querySelector('[data-role="edit"]').addEventListener("click", () => startEditIdentity(row, key));
    });
  }

  function startEditIdentity(row, key) {
    const current = (vaultData.identity && vaultData.identity[key]) || "";
    row.innerHTML = `
      <input class="id-edit-input" type="text" value="${esc(current)}" />
      <div class="id-actions">
        <button class="icon-btn copy" data-role="confirm" title="Save">✓</button>
        <button class="icon-btn" data-role="cancel" title="Cancel">✕</button>
      </div>`;
    const input = row.querySelector("input");
    input.focus();
    input.select();
    const confirm = async () => {
      vaultData.identity[key] = input.value.trim();
      renderIdentity();
      await persist();
    };
    row.querySelector('[data-role="confirm"]').addEventListener("click", confirm);
    row.querySelector('[data-role="cancel"]').addEventListener("click", renderIdentity);
    input.addEventListener("keypress", (e) => { if (e.key === "Enter") confirm(); });
    input.addEventListener("keydown", (e) => { if (e.key === "Escape") renderIdentity(); });
  }

  // ── Documents ─────────────────────────────────────────────────
  function renderDocuments() {
    const list = document.getElementById("docList");
    const docs = vaultData.documents || [];
    if (docs.length === 0) { list.innerHTML = '<div class="empty">No documents saved</div>'; return; }
    list.innerHTML = docs.map((d, i) => `
      <div class="item-card" data-index="${i}">
        <div class="item-info">
          <div class="item-name">${esc(d.name)}</div>
          <div class="item-detail">${esc(d.desc || "")}${d.link ? `<br><a href="${esc(d.link)}" target="_blank" rel="noopener" style="color:var(--accent);font-family:'Inter',sans-serif;">Open link →</a>` : ""}</div>
        </div>
        <div class="item-actions">
          <button class="icon-btn copy" data-role="copy" title="Copy link">📋</button>
          <button class="icon-btn del" data-role="del" title="Delete">✕</button>
        </div>
      </div>`).join("");

    list.querySelectorAll(".item-card").forEach((card) => {
      const i = Number(card.dataset.index);
      card.querySelector('[data-role="copy"]').addEventListener("click", () => {
        navigator.clipboard.writeText(docs[i].link || ""); showToast("Link copied");
      });
      card.querySelector('[data-role="del"]').addEventListener("click", async () => {
        vaultData.documents.splice(i, 1);
        renderDocuments();
        await persist();
        showToast("Document deleted");
      });
    });
  }

  document.getElementById("addDocBtn").addEventListener("click", async () => {
    const name = document.getElementById("docName").value.trim();
    const link = document.getElementById("docLink").value.trim();
    const desc = document.getElementById("docDesc").value.trim();
    if (!name) { showToast("Enter a document name", true); return; }
    vaultData.documents.push({ name, link, desc });
    document.getElementById("docName").value = "";
    document.getElementById("docLink").value = "";
    document.getElementById("docDesc").value = "";
    renderDocuments();
    await persist();
    showToast("Document added");
  });

  // ── Notes ─────────────────────────────────────────────────────
  document.getElementById("saveNotesBtn").addEventListener("click", async () => {
    vaultData.notes = document.getElementById("notesArea").value;
    await persist();
    showToast("Notes saved");
  });

  function renderAll() {
    renderCredentials();
    renderIdentity();
    renderDocuments();
    document.getElementById("notesArea").value = vaultData.notes || "";
  }
})();
</script>
</body>
</html>
