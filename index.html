<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Vault • Sanjeet</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0e14;
            --card: #12161f;
            --card2: #171c27;
            --border: #232936;
            --text: #eef1f6;
            --muted: #8892a4;
            --accent: #4f8fff;
            --accent2: #7c5cfc;
            --green: #22c55e;
            --red: #ef4444;
            --orange: #f59e0b;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', -apple-system, sans-serif;
            padding: 1rem;
            color: var(--text);
        }
        .container {
            width: 100%;
            max-width: 520px;
        }

        /* LOGIN */
        .login-card {
            background: var(--card);
            border-radius: 1.5rem;
            border: 1px solid var(--border);
            padding: 2rem 1.5rem;
            box-shadow: 0 20px 60px -20px rgba(0, 0, 0, 0.6);
            text-align: center;
        }
        .login-card .icon {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }
        .login-card h1 {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 0.3rem;
        }
        .login-card .sub {
            font-size: 0.8rem;
            color: var(--muted);
            margin-bottom: 1.5rem;
        }
        .login-card input {
            width: 100%;
            background: #0d1117;
            border: 1px solid var(--border);
            border-radius: 0.8rem;
            padding: 0.85rem 1rem;
            color: var(--text);
            font-size: 0.95rem;
            outline: none;
            margin-bottom: 0.7rem;
            font-family: inherit;
        }
        .login-card input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(79, 143, 255, 0.1);
        }
        .login-card button {
            width: 100%;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #fff;
            border: none;
            border-radius: 0.8rem;
            padding: 0.9rem;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            font-family: inherit;
            margin-top: 0.3rem;
        }
        .login-card button:active {
            transform: scale(0.97);
        }
        .login-error {
            color: var(--red);
            font-size: 0.8rem;
            margin-top: 0.5rem;
            display: none;
        }

        /* DASHBOARD */
        .dashboard {
            display: none;
            background: var(--card);
            border-radius: 1.5rem;
            border: 1px solid var(--border);
            padding: 1.5rem 1.3rem;
            box-shadow: 0 20px 60px -20px rgba(0, 0, 0, 0.6);
        }
        .dash-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.2rem;
        }
        .dash-header h2 {
            font-size: 1.3rem;
            font-weight: 700;
        }
        .dash-header .logout-btn {
            background: var(--card2);
            border: 1px solid var(--border);
            color: var(--muted);
            padding: 0.5rem 1rem;
            border-radius: 0.7rem;
            font-size: 0.8rem;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
        }
        .dash-header .logout-btn:hover {
            color: var(--red);
            border-color: var(--red);
        }

        /* TABS */
        .tabs {
            display: flex;
            gap: 0.3rem;
            margin-bottom: 1.2rem;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 0.3rem;
        }
        .tabs button {
            background: var(--card2);
            border: 1px solid var(--border);
            color: var(--muted);
            padding: 0.6rem 0.9rem;
            border-radius: 0.7rem;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            font-family: inherit;
            transition: all 0.2s;
        }
        .tabs button.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        /* TAB CONTENT */
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .section-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
            margin-bottom: 0.6rem;
            font-weight: 700;
        }
        .form-row {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.6rem;
        }
        .form-row input {
            flex: 1;
            background: #0d1117;
            border: 1px solid var(--border);
            border-radius: 0.7rem;
            padding: 0.7rem 0.9rem;
            color: var(--text);
            font-size: 0.85rem;
            outline: none;
            font-family: inherit;
        }
        .form-row input:focus {
            border-color: var(--accent);
        }
        .form-row button {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #fff;
            border: none;
            border-radius: 0.7rem;
            padding: 0.7rem 1rem;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            white-space: nowrap;
            font-family: inherit;
        }
        .form-row button:active {
            transform: scale(0.95);
        }
        .full-input {
            width: 100%;
            background: #0d1117;
            border: 1px solid var(--border);
            border-radius: 0.7rem;
            padding: 0.7rem 0.9rem;
            color: var(--text);
            font-size: 0.85rem;
            outline: none;
            font-family: inherit;
            margin-bottom: 0.6rem;
        }
        textarea.full-input {
            resize: vertical;
            min-height: 200px;
        }

        /* ITEM CARD */
        .item-card {
            background: var(--card2);
            border: 1px solid var(--border);
            border-radius: 0.8rem;
            padding: 0.8rem 0.9rem;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
        }
        .item-info {
            flex: 1;
            min-width: 0;
        }
        .item-name {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text);
        }
        .item-detail {
            font-size: 0.72rem;
            color: var(--muted);
            margin-top: 0.15rem;
            word-break: break-all;
        }
        .item-actions {
            display: flex;
            gap: 0.3rem;
            flex-shrink: 0;
        }
        .icon-btn {
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--muted);
            width: 2rem;
            height: 2rem;
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            cursor: pointer;
        }
        .icon-btn.copy:hover {
            color: var(--accent);
            border-color: var(--accent);
        }
        .icon-btn.del:hover {
            color: var(--red);
            border-color: var(--red);
        }

        /* IDENTITY FIELDS */
        .id-field {
            background: var(--card2);
            border: 1px solid var(--border);
            border-radius: 0.8rem;
            padding: 0.7rem 0.9rem;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .id-label {
            font-size: 0.72rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
        }
        .id-value {
            font-size: 0.85rem;
            color: var(--text);
            font-weight: 500;
            text-align: right;
            word-break: break-all;
        }
        .id-actions {
            display: flex;
            gap: 0.3rem;
            margin-left: 0.5rem;
        }

        .empty {
            color: #4a5264;
            text-align: center;
            padding: 2rem;
            font-size: 0.85rem;
        }
        .status {
            text-align: center;
            font-size: 0.72rem;
            color: var(--green);
            min-height: 1.2rem;
            margin-top: 0.3rem;
        }
        .status.err {
            color: var(--red);
        }
        .toast {
            position: fixed;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            background: #1c2129;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.7rem 1.2rem;
            border-radius: 0.8rem;
            font-size: 0.82rem;
            font-weight: 500;
            z-index: 999;
            transition: opacity 0.3s;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- LOGIN -->
        <div class="login-card" id="loginScreen">
            <div class="icon">🔐</div>
            <h1>Vault</h1>
            <div class="sub">Secure personal vault</div>
            <input type="text" id="usernameInput" placeholder="Username" autocomplete="off" />
            <input type="password" id="passwordInput" placeholder="Password" />
            <button id="loginBtn">Unlock</button>
            <div class="login-error" id="loginError">Invalid username or password</div>
            <div class="status" id="loginStatus"></div>
        </div>

        <!-- DASHBOARD -->
        <div class="dashboard" id="dashboard">
            <div class="dash-header">
                <h2>🔐 Vault</h2>
                <button class="logout-btn" id="logoutBtn">Lock</button>
            </div>

            <div class="tabs" id="tabs">
                <button class="active" data-tab="credentials">🔑 Credentials</button>
                <button data-tab="identity">🪪 Identity</button>
                <button data-tab="documents">📎 Docs</button>
                <button data-tab="notes">📝 Notes</button>
            </div>

            <!-- Credentials Tab -->
            <div class="tab-content active" id="tab-credentials">
                <div class="section-title">Add Login Credential</div>
                <div class="form-row">
                    <input type="text" id="credSite" placeholder="Site/App name" />
                    <input type="text" id="credId" placeholder="ID/Email" />
                </div>
                <div class="form-row">
                    <input type="text" id="credPass" placeholder="Password" />
                    <button id="addCredBtn">+ Add</button>
                </div>
                <div class="status" id="credStatus"></div>
                <div class="section-title" style="margin-top:1rem;">Saved Credentials</div>
                <div id="credList"><div class="empty">No credentials saved</div></div>
            </div>

            <!-- Identity Tab -->
            <div class="tab-content" id="tab-identity">
                <div class="section-title">Identity Documents</div>
                <div id="identityFields"></div>
                <button id="saveIdentityBtn" style="width:100%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:0.7rem;padding:0.7rem;font-weight:700;font-size:0.85rem;cursor:pointer;font-family:inherit;margin-top:0.5rem;">💾 Save Identity</button>
                <div class="status" id="identityStatus"></div>
            </div>

            <!-- Documents Tab -->
            <div class="tab-content" id="tab-documents">
                <div class="section-title">Add Document</div>
                <input type="text" id="docName" class="full-input" placeholder="Document name (e.g., PAN Card PDF)" />
                <input type="url" id="docLink" class="full-input" placeholder="Link (Google Drive, iCloud, etc.)" />
                <input type="text" id="docDesc" class="full-input" placeholder="Description (optional)" />
                <button id="addDocBtn" style="width:100%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:0.7rem;padding:0.7rem;font-weight:700;font-size:0.85rem;cursor:pointer;font-family:inherit;">+ Add Document</button>
                <div class="status" id="docStatus"></div>
                <div class="section-title" style="margin-top:1rem;">Saved Documents</div>
                <div id="docList"><div class="empty">No documents saved</div></div>
            </div>

            <!-- Notes Tab -->
            <div class="tab-content" id="tab-notes">
                <div class="section-title">Secure Notes</div>
                <textarea id="notesArea" class="full-input" placeholder="Write anything... unlimited text, no word limit."></textarea>
                <button id="saveNotesBtn" style="width:100%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:0.7rem;padding:0.7rem;font-weight:700;font-size:0.85rem;cursor:pointer;font-family:inherit;">💾 Save Notes</button>
                <div class="status" id="notesStatus"></div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // CONFIG
            const GIST_ID = "089b4bf03ea9475884704cd42a8659a3";
            const GITHUB_TOKEN = "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";
            const API_BASE = "https://api.github.com/gists/" + GIST_ID;

            let vaultData = null;
            let loggedIn = false;

            // DOM
            const loginScreen = document.getElementById("loginScreen");
            const dashboard = document.getElementById("dashboard");
            const loginError = document.getElementById("loginError");
            const loginStatus = document.getElementById("loginStatus");

            function showToast(msg, err) {
                const existing = document.querySelector(".toast");
                if (existing) existing.remove();
                const t = document.createElement("div");
                t.className = "toast";
                t.style.color = err ? "var(--red)" : "var(--text)";
                t.textContent = msg;
                document.body.appendChild(t);
                setTimeout(() => { t.style.opacity = "0";
                    setTimeout(() => t.remove(), 300); }, 2000);
            }

            // API calls
            async function loadVault() {
                const res = await fetch(API_BASE, {
                    headers: { Authorization: "token " + GITHUB_TOKEN }
                });
                if (!res.ok) throw new Error("Load failed");
                const data = await res.json();
                const file = data.files["vault.json"];
                if (!file) throw new Error("No vault file");
                return JSON.parse(file.content);
            }

            async function saveVault(data) {
                const res = await fetch(API_BASE, {
                    method: "PATCH",
                    headers: {
                        Authorization: "token " + GITHUB_TOKEN,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        files: {
                            "vault.json": { content: JSON.stringify(data, null, 2) }
                        }
                    })
                });
                if (!res.ok) throw new Error("Save failed");
            }

            // LOGIN
            document.getElementById("loginBtn").addEventListener("click", async () => {
                const user = document.getElementById("usernameInput").value.trim();
                const pass = document.getElementById("passwordInput").value;
                loginError.style.display = "none";
                loginStatus.textContent = "";

                if (user.toLowerCase() !== "sanjeet") {
                    loginError.style.display = "block";
                    return;
                }

                loginStatus.textContent = "Unlocking...";
                try {
                    vaultData = await loadVault();
                    if (vaultData.password === pass) {
                        loggedIn = true;
                        loginScreen.style.display = "none";
                        dashboard.style.display = "block";
                        renderAll();
                        showToast("Welcome, Sanjeet!");
                    } else {
                        loginError.style.display = "block";
                    }
                } catch (e) {
                    loginStatus.textContent = "Connection error";
                    loginStatus.className = "status err";
                }
                loginStatus.textContent = "";
            });

            document.getElementById("passwordInput").addEventListener("keypress", (e) => {
                if (e.key === "Enter") document.getElementById("loginBtn").click();
            });

            // LOGOUT
            document.getElementById("logoutBtn").addEventListener("click", () => {
                loggedIn = false;
                vaultData = null;
                dashboard.style.display = "none";
                loginScreen.style.display = "block";
                document.getElementById("passwordInput").value = "";
            });

            // TABS
            document.querySelectorAll(".tabs button").forEach(btn => {
                btn.addEventListener("click", () => {
                    document.querySelectorAll(".tabs button").forEach(b => b.classList.remove(
                        "active"));
                    document.querySelectorAll(".tab-content").forEach(t => t.classList.remove("active"));
                    btn.classList.add("active");
                    document.getElementById("tab-" + btn.dataset.tab).classList.add("active");
                    if (btn.dataset.tab === "identity") renderIdentity();
                    if (btn.dataset.tab === "notes") document.getElementById("notesArea").value =
                        vaultData.notes || "";
                });
            });

            // CREDENTIALS
            function renderCredentials() {
                const list = document.getElementById("credList");
                const creds = vaultData.credentials || [];
                if (creds.length === 0) {
                    list.innerHTML = '<div class="empty">No credentials saved</div>';
                    return;
                }
                list.innerHTML = creds.map((c, i) => `
                    <div class="item-card">
                        <div class="item-info">
                            <div class="item-name">${esc(c.site)}</div>
                            <div class="item-detail">ID: ${esc(c.id)} | Pass: ${esc(c.pass)}</div>
                        </div>
                        <div class="item-actions">
                            <button class="icon-btn copy" onclick="navigator.clipboard.writeText('${esc(c.id)}')" title="Copy ID">📋</button>
                            <button class="icon-btn copy" onclick="navigator.clipboard.writeText('${esc(c.pass)}')" title="Copy Password">🔑</button>
                            <button class="icon-btn del" onclick="deleteCred(${i})">✕</button>
                        </div>
                    </div>
                `).join("");
            }

            function esc(s) { return (s || "").replace(/"/g, '&quot;').replace(/</g, '&lt;'); }

            window.deleteCred = async function(i) {
                vaultData.credentials.splice(i, 1);
                await saveVault(vaultData);
                renderCredentials();
                showToast("Credential deleted");
            };

            document.getElementById("addCredBtn").addEventListener("click", async () => {
                const site = document.getElementById("credSite").value.trim();
                const id = document.getElementById("credId").value.trim();
                const pass = document.getElementById("credPass").value.trim();
                if (!site) { showToast("Enter site name", true); return; }
                vaultData.credentials.push({ site, id, pass });
                await saveVault(vaultData);
                document.getElementById("credSite").value = "";
                document.getElementById("credId").value = "";
                document.getElementById("credPass").value = "";
                renderCredentials();
                showToast("Credential added!");
            });

            // IDENTITY
            function renderIdentity() {
                const container = document.getElementById("identityFields");
                const id = vaultData.identity || {};
                const fields = [
                    { key: "pan", label: "PAN Card" },
                    { key: "aadhaar", label: "Aadhaar Card" },
                    { key: "dl", label: "Driving License" },
                    { key: "bankAc", label: "Bank Account" },
                    { key: "ifsc", label: "IFSC Code" },
                    { key: "upi", label: "UPI ID" },
                    { key: "other", label: "Other Details" },
                ];
                container.innerHTML = fields.map(f => `
                    <div class="id-field">
                        <span class="id-label">${f.label}</span>
                        <span class="id-value">${esc(id[f.key] || '—')}</span>
                        <div class="id-actions">
                            <button class="icon-btn copy" onclick="navigator.clipboard.writeText('${esc(id[f.key] || '')}')">📋</button>
                            <button class="icon-btn" onclick="editIdentityField('${f.key}')">✏️</button>
                        </div>
                    </div>
                `).join("");
            }

            window.editIdentityField = function(key) {
                const current = vaultData.identity[key] || "";
                const val = prompt("Enter " + key + ":", current);
                if (val !== null) {
                    vaultData.identity[key] = val;
                    saveVault(vaultData);
                    renderIdentity();
                    showToast("Updated!");
                }
            };

            document.getElementById("saveIdentityBtn").addEventListener("click", async () => {
                await saveVault(vaultData);
                showToast("Identity saved!");
            });

            // DOCUMENTS
            function renderDocuments() {
                const list = document.getElementById("docList");
                const docs = vaultData.documents || [];
                if (docs.length === 0) {
                    list.innerHTML = '<div class="empty">No documents saved</div>';
                    return;
                }
                list.innerHTML = docs.map((d, i) => `
                    <div class="item-card">
                        <div class="item-info">
                            <div class="item-name">${esc(d.name)}</div>
                            <div class="item-detail">${esc(d.desc || '')}<br><a href="${esc(d.link)}" target="_blank" style="color:var(--accent);font-size:0.7rem;">Open Link →</a></div>
                        </div>
                        <div class="item-actions">
                            <button class="icon-btn copy" onclick="navigator.clipboard.writeText('${esc(d.link)}')" title="Copy Link">📋</button>
                            <button class="icon-btn del" onclick="deleteDoc(${i})">✕</button>
                        </div>
                    </div>
                `).join("");
            }

            window.deleteDoc = async function(i) {
                vaultData.documents.splice(i, 1);
                await saveVault(vaultData);
                renderDocuments();
                showToast("Document deleted");
            };

            document.getElementById("addDocBtn").addEventListener("click", async () => {
                const name = document.getElementById("docName").value.trim();
                const link = document.getElementById("docLink").value.trim();
                const desc = document.getElementById("docDesc").value.trim();
                if (!name) { showToast("Enter document name", true); return; }
                vaultData.documents.push({ name, link, desc });
                await saveVault(vaultData);
                document.getElementById("docName").value = "";
                document.getElementById("docLink").value = "";
                document.getElementById("docDesc").value = "";
                renderDocuments();
                showToast("Document added!");
            });

            // NOTES
            document.getElementById("saveNotesBtn").addEventListener("click", async () => {
                vaultData.notes = document.getElementById("notesArea").value;
                await saveVault(vaultData);
                showToast("Notes saved!");
            });

            // RENDER ALL
            function renderAll() {
                renderCredentials();
                renderDocuments();
                document.getElementById("notesArea").value = vaultData.notes || "";
            }

            // Init - check if already logged in (session)
            if (sessionStorage.getItem("vault_logged") === "sanjeet") {
                loadVault().then(data => {
                    vaultData = data;
                    loggedIn = true;
                    loginScreen.style.display = "none";
                    dashboard.style.display = "block";
                    renderAll();
                }).catch(() => {});
            }

            // Save session on login, clear on logout
            const origLogin = document.getElementById("loginBtn").addEventListener("click", function() {});
            document.getElementById("loginBtn").addEventListener("click", function() {
                setTimeout(() => {
                    if (loggedIn) sessionStorage.setItem("vault_logged", "sanjeet");
                }, 500);
            });
            document.getElementById("logoutBtn").addEventListener("click", () => {
                sessionStorage.removeItem("vault_logged");
            });
        })();
    </script>
</body>
</html>
